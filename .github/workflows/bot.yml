name: Run Bot 24/7

on:
  schedule:
    - cron: "0 */5 * * *" # Запуск по расписанию каждые 5 часов
  workflow_dispatch: # Позволяет запустить скрипт вручную кнопкой

concurrency:
  group: bot-process
  cancel-in-progress: true # Убивает старого бота при запуске нового (чтобы не было конфликта токенов в Telegram)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # Лимит жизни сервера — 5 часов

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Замените на вашу версию Python (например, 3.9 или 3.11)

      - name: Install dependencies
        run: pip install -r requirements.txt # Убедитесь, что у вас есть этот файл со списком библиотек

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }} # Берет токен из скрытых настроек
        run: python main.py # Замените main.py на имя вашего файла
